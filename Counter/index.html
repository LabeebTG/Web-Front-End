<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <label id="count">0</label><br>
    <div id="Container1">
        <button id="decrease" class="buttons" >Decrease</button>
        <button id="reset" class="buttons">Reset</button>
        <button id="increase" class="buttons">Increase</button><br><br>
        <button id="random" class="buttons">Random</button>
    </div>

    <label id="guess">Guess the number between 1 and 100:</label>
    <input type="number" id="guessInput" min="1" max="100">
    
    <div id="Container1">
    <button id="guessBtn" class="buttons">Submit Guess</button>
    <p id="feedback"></p>
    <button id="generatePassword" class="buttons">Generate Random Password</button>
    <p id="passwordDisplay"></p>
    </div>


    <script src="script.js"></script>
</body>
</html>
